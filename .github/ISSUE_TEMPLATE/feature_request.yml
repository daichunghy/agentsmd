name: Feature request
description: Propose a change to lint, doctor, sync, score, init, or the Action
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        agentsmd stays a verifier. Instruction enforcement, a registry,
        and MCP are out of scope for v0.1.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
