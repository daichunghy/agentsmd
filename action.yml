name: agentsmd
description: >-
  Lint, verify wiring, and score AGENTS.md and friends. Loads
  agentsmd.config.json from the repo root when that file exists.
branding:
  icon: check-circle
  color: blue

inputs:
  fail-on:
    description: 'Fail the check at this severity: "error", "warning", or "never"'
    required: false
    default: error
  badge-write:
    description: >-
      Commit score.json to the gh-pages branch on pushes to the default
      branch, for a shields.io/endpoint badge.
    required: false
    default: "false"
  config:
    description: >-
      Repository-relative path to a JSON config file. Defaults to
      agentsmd.config.json at the repo root when that file exists.
    required: false
    default: ""

outputs:
  score:
    description: The 0-100 agentsmd score.
  report:
    description: Path to the canonical score JSON artifact.

runs:
  using: node20
  main: action-dist/index.js
